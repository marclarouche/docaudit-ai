[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "docaudit-ai"
version = "0.2.0"
description = "Local deterministic technical documentation audits"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2", "python-docx==1.2.0", "textstat==0.7.10", "pyphen==0.18.1", "PyYAML>=6.0.2,<7", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
